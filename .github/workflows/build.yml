name: Build

# Every push to main:
#   1. runs the server tests and builds the web app
#   2. builds the Android app (published to the "android-latest" release)
#   3. builds the Docker image ghcr.io/<owner>/mylib:latest (with the APK inside,
#      so the phone can download it from the server's Settings page)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Server tests
        working-directory: server
        run: |
          npm ci
          npm test
      - name: Web build
        working-directory: web
        run: |
          npm ci
          npm run build

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/mylib.jks"
            echo "MYLIB_KEYSTORE=$RUNNER_TEMP/mylib.jks" >> "$GITHUB_ENV"
            echo "Signing with the release key"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set - APK is signed with a throwaway debug key (updates will need an uninstall)"
          fi
      - name: Build APK
        working-directory: android
        env:
          MYLIB_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MYLIB_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MYLIB_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease \
            -PversionCode=${{ github.run_number }} -PversionName=1.0.${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/mylib.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: mylib.apk
      - name: Publish to the android-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: MyLib Android app (latest)
          body: |
            Latest MyLib Android app, version 1.0.${{ github.run_number }} (commit ${{ github.sha }}).
            Install on the phone, then enter your MyLib server address (e.g. your NetBird IP and port).
          files: mylib.apk
          make_latest: true

  docker:
    needs: [test, android]
    # Still publish the server if only the Android build failed.
    if: always() && needs.test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Include the APK
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: apk
          path: server/apk
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: APP_VERSION=1.0.${{ github.run_number }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/mylib:latest
            ghcr.io/${{ github.repository_owner }}/mylib:1.0.${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
